<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Kris - Butterflies 🦋</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #080c14;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Mensagem final que aparece quando a borboleta azul pousa */
        .message-card {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            z-index: 2;
            text-align: center;
            opacity: 0;
            transition: opacity 1.5s ease, transform 1.5s ease;
            width: 85%;
            max-width: 360px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #38bdf8;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
            backdrop-filter: blur(6px);
            pointer-events: none;
        }

        .message-card.visible {
            opacity: 1;
            transform: translateX(-50%) scale(1);
            pointer-events: auto;
        }

        h1 {
            color: #38bdf8;
            font-size: 1.5rem;
            margin: 0 0 8px 0;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
            letter-spacing: 2px;
        }

        p.quote {
            color: #e2e8f0;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .btn-surprise {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #080c14;
            border: none;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            transition: transform 0.2s;
        }
        .btn-surprise:active { transform: scale(0.95); }

        /* Modal Secreta */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.9);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }
        .modal-box {
            background: #0f172a;
            border: 2px solid #38bdf8;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            max-width: 300px;
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.4);
        }
        .modal-box p {
            color: #f8fafc;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .close-btn {
            background: #38bdf8;
            color: #080c14;
            border: none;
            padding: 9px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>

    <canvas id="butterflyCanvas"></canvas>

    <div class="message-card" id="messageCard">
        <h1>FOR KRIS 🦋</h1>
        <p class="quote">Out of all the paths in the world, my favorite is the one that leads to you. ✨</p>
        <button class="btn-surprise" onclick="openModal()">Click for a secret 💙</button>
    </div>

    <!-- Modal Secreta -->
    <div id="secretModal" class="modal">
        <div class="modal-box">
            <p>You bring so much light and color into my universe, Kris! 🌌💙</p>
            <button class="close-btn" onclick="closeModal()">Close ✨</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('butterflyCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Cores pastéis para as borboletas de fundo
        const pastelColors = ['#fbcfe8', '#fed7aa', '#e9d5ff', '#bae6fd', '#c7d2fe'];

        class Butterfly {
            constructor(isSpecial = false) {
                this.isSpecial = isSpecial;
                this.reset();
            }

            reset() {
                if (this.isSpecial) {
                    // A borboleta azul turquesa começa no canto inferior direito
                    this.x = canvas.width + 50;
                    this.y = canvas.height * 0.75;
                    this.targetX = canvas.width / 2;
                    this.targetY = canvas.height * 0.55;
                    this.color = '#22d3ee';
                    this.glowColor = '#38bdf8';
                    this.speed = 1.8;
                } else {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.color = pastelColors[Math.floor(Math.random() * pastelColors.length)];
                    this.speed = Math.random() * 1 + 0.5;
                    this.angle = Math.random() * Math.PI * 2;
                }
                this.wingAngle = 0;
                this.wingSpeed = 0.15;
            }

            update(progress) {
                this.wingAngle += this.wingSpeed;

                if (this.isSpecial) {
                    // Movimento guiado da borboleta azul turquesa em direção ao centro
                    let dx = this.targetX - this.x;
                    let dy = this.targetY - this.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist > 2) {
                        this.x += (dx / dist) * this.speed;
                        this.y += (dy / dist) * this.speed;
                    } else {
                        // Quando chega perto, faz um leve movimento de pouso
                        this.y = canvas.height * 0.55 + Math.sin(progress * 3) * 3;
                    }
                } else {
                    // Borboletas pastéis voando livremente pelo fundo
                    this.angle += (Math.random() - 0.5) * 0.2;
                    this.x += Math.cos(this.angle) * this.speed;
                    this.y += Math.sin(this.angle) * this.speed;

                    if (this.x < -30) this.x = canvas.width + 30;
                    if (this.x > canvas.width + 30) this.x = -30;
                    if (this.y < -30) this.y = canvas.height + 30;
                    if (this.y > canvas.height + 30) this.y = -30;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                let scaleX = Math.cos(this.wingAngle); // Efeito de bater as asas

                if (this.isSpecial) {
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = this.glowColor;
                }

                ctx.fillStyle = this.color;

                // Asa Esquerda
                ctx.save();
                ctx.scale(scaleX, 1);
                ctx.beginPath();
                ctx.ellipse(-10, 0, 12, 18, -Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Asa Direita
                ctx.save();
                ctx.scale(scaleX, 1);
                ctx.beginPath();
                ctx.ellipse(10, 0, 12, 18, Math.PI / 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                // Corpo da borboleta
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.ellipse(0, 0, 2, 10, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // Criar borboletas de fundo + a borboleta azul especial
        let butterflies = [];
        for (let i = 0; i < 25; i++) {
            butterflies.push(new Butterfly(false));
        }
        let specialButterfly = new Butterfly(true);

        let startTime = Date.now();
        let cardShown = false;

        function animate() {
            ctx.fillStyle = 'rgba(8, 12, 20, 0.25)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let elapsed = (Date.now() - startTime) / 1000;

            // Atualizar e desenhar borboletas de fundo
            butterflies.forEach(b => {
                b.update(elapsed);
                b.draw();
            });

            // Atualizar e desenhar a borboleta azul especial após 1.5 segundos
            if (elapsed > 1.5) {
                specialButterfly.update(elapsed);
                specialButterfly.draw();
            }

            // Mostrar o cartão de mensagem quando a borboleta azul chega ao centro
            if (elapsed > 4.5 && !cardShown) {
                cardShown = true;
                document.getElementById('messageCard').classList.add('visible');
            }

            requestAnimationFrame(animate);
        }

        animate();

        // Funções da modal
        function openModal() {
            document.getElementById('secretModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('secretModal').style.display = 'none';
        }
    </script>

</body>
</html>
