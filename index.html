<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Kris - Realistic Eye 🌌</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #020617;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Cartão final que aparece após o zoom */
        .final-content {
            position: relative;
            z-index: 2;
            text-align: center;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 85%;
            max-width: 380px;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid #facc15;
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 0 50px rgba(250, 204, 21, 0.4);
        }

        .final-content.visible {
            opacity: 1;
            pointer-events: auto;
        }

        h1 {
            color: #facc15;
            font-size: 1.6rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 15px rgba(250, 204, 21, 0.8);
            letter-spacing: 2px;
        }

        p.quote {
            color: #e2e8f0;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }

        .btn-surprise {
            background: linear-gradient(135deg, #facc15, #d97706);
            color: #030712;
            border: none;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 4px 15px rgba(250, 204, 21, 0.4);
            width: 100%;
            transition: transform 0.2s;
        }
        .btn-surprise:active { transform: scale(0.96); }

        /* Modal Secreta */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.92);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
        }
        .modal-box {
            background: #0f172a;
            border: 2px solid #facc15;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            max-width: 300px;
            box-shadow: 0 0 40px rgba(250, 204, 21, 0.4);
        }
        .modal-box p {
            color: #f8fafc;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .close-btn {
            background: #facc15;
            color: #030712;
            border: none;
            padding: 9px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>

    <canvas id="realisticEyeCanvas"></canvas>

    <div class="final-content" id="finalContent">
        <h1>FOR KRIS 🌌</h1>
        <p class="quote">May the stars light up your path wherever you go. ✨</p>
        <button class="btn-surprise" onclick="openModal()">Click for a secret 💫</button>
    </div>

    <!-- Modal Secreta -->
    <div id="secretModal" class="modal">
        <div class="modal-box">
            <p>They say stars shine brighter when you're around the right person... 💫<br><br>*(Compiled specially for you!)*</p>
            <button class="close-btn" onclick="closeModal()">Close 💙</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('realisticEyeCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let zoom = 1;
        let timer = 0;
        let blinkProgress = 1; // 1 = aberto, 0 = fechado
        let heartAlpha = 0;

        function animate() {
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(zoom, zoom);

            timer += 0.025;

            // Piscar natural nos primeiros segundos
            if (timer > 1.5 && timer < 1.9) {
                blinkProgress = 0.05; // fechado
            } else if (timer >= 1.9 && timer < 2.3) {
                blinkProgress = (timer - 1.9) / 0.4; // a abrir
            } else {
                blinkProgress = 1;
            }

            // Iniciar zoom progressivo em direção à pupila após o piscar
            if (timer > 3.2) {
                zoom += 0.03;
            }

            const eyeWidth = 170;
            const eyeHeight = 85 * blinkProgress;

            // Fundo da esclera (branco do olho com sombra realista)
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(0, 0, eyeWidth, eyeHeight, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#f8fafc';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
            ctx.shadowBlur = 30;
            ctx.fill();
            ctx.restore();

            // Íris e detalhes se o olho não estiver totalmente fechado
            if (blinkProgress > 0.1) {
                ctx.save();
                ctx.beginPath();
                ctx.ellipse(0, 0, eyeWidth, eyeHeight, 0, 0, Math.PI * 2);
                ctx.clip(); // Mantém tudo dentro do formato do olho

                const irisRadius = 65;

                // 1. Íris Externa (Verde-claro realista com gradiente)
                let irisGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, irisRadius);
                irisGrad.addColorStop(0, '#86efac');
                irisGrad.addColorStop(0.5, '#4ade80');
                irisGrad.addColorStop(0.9, '#15803d');
                irisGrad.addColorStop(1, '#052e16');
                
                ctx.fillStyle = irisGrad;
                ctx.beginPath();
                ctx.arc(0, 0, irisRadius, 0, Math.PI * 2);
                ctx.fill();

                // Fibras radiais da íris para dar textura real
                ctx.strokeStyle = 'rgba(20, 83, 45, 0.35)';
                ctx.lineWidth = 1.2;
                for (let i = 0; i < 60; i++) {
                    let angle = (i * Math.PI * 2) / 60;
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(angle) * 18, Math.sin(angle) * 18);
                    ctx.lineTo(Math.cos(angle) * irisRadius, Math.sin(angle) * irisRadius);
                    ctx.stroke();
                }

                // Anel limbar escuro na borda da íris
                ctx.strokeStyle = '#022c22';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, irisRadius - 1, 0, Math.PI * 2);
                ctx.stroke();

                // 2. Heterocromatina Central (Castanho orgânico ao redor da pupila)
                let heteroRadius = 28;
                let heteroGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, heteroRadius);
                heteroGrad.addColorStop(0, '#78350f');
                heteroGrad.addColorStop(0.6, '#92400e');
                heteroGrad.addColorStop(1, 'transparent');

                ctx.fillStyle = heteroGrad;
                ctx.beginPath();
                ctx.arc(0, 0, heteroRadius, 0, Math.PI * 2);
                ctx.fill();

                // Detalhes irregulares da heterocromatina castanha
                ctx.strokeStyle = 'rgba(60, 25, 5, 0.6)';
                ctx.lineWidth = 1.5;
                for (let j = 0; j < 16; j++) {
                    let hAngle = (j * Math.PI * 2) / 16;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(Math.cos(hAngle) * (heteroRadius + Math.random() * 5), Math.sin(hAngle) * (heteroRadius + Math.random() * 5));
                    ctx.stroke();
                }

                // 3. Pupila Negra com profundidade
                const pupilRadius = 14;
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(0, 0, pupilRadius, 0, Math.PI * 2);
                ctx.fill();

                // Se o zoom entrar na pupila, o coração dourado surge lá dentro e cresce
                if (zoom > 2.0) {
                    heartAlpha = Math.min(heartAlpha + 0.05, 1);
                    ctx.save();
                    ctx.globalAlpha = heartAlpha;
                    ctx.fillStyle = '#facc15';
                    ctx.shadowColor = '#f59e0b';
                    ctx.shadowBlur = 15;
                    
                    ctx.beginPath();
                    let scaleH = Math.min((zoom - 2.0) * 1.8, 14);
                    ctx.scale(scaleH, scaleH);
                    ctx.moveTo(0, -2);
                    ctx.bezierCurveTo(4, -8, 10, -2, 0, 8);
                    ctx.bezierCurveTo(-10, -2, -4, -8, 0, -2);
                    ctx.fill();
                    ctx.restore();
                }

                // 4. Reflexo de Luz / Brilho Húmido da Córnea (Specular Highlights)
                let glossGrad = ctx.createRadialGradient(-20, -25, 2, -20, -25, 25);
                glossGrad.addColorStop(0, 'rgba(255, 255, 255, 0.75)');
                glossGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = glossGrad;
                ctx.beginPath();
                ctx.arc(-20, -25, 25, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            // Pálpebras superior e inferior (efeito realista de contorno e pestanas)
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 4;
            // Pálpebra superior
            ctx.beginPath();
            ctx.arc(0, -eyeHeight - 15, eyeWidth * 1.1, 0.2, Math.PI - 0.2);
            ctx.stroke();
            // Pálpebra inferior
            ctx.beginPath();
            ctx.arc(0, eyeHeight + 15, eyeWidth * 1.1, Math.PI + 0.2, 2 * Math.PI - 0.2);
            ctx.stroke();

            ctx.restore();

            // Revelar o cartão final assim que o zoom avança para dentro da pupila
            if (zoom > 5.0) {
                const finalCard = document.getElementById('finalContent');
                if (finalCard && !finalCard.classList.contains('visible')) {
                    finalCard.classList.add('visible');
                }
            }

            if (zoom < 8) {
                requestAnimationFrame(animate);
            }
        }

        animate();

        // Funções da modal
        function openModal() {
            const modal = document.getElementById('secretModal');
            if (modal) modal.style.display = 'flex';
        }

        function closeModal() {
            const modal = document.getElementById('secretModal');
            if (modal) modal.style.display = 'none';
        }
    </script>

</body>
</html>
