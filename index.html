<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Kris - Real Eye Zoom 🌌</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #020617;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Contentor circular do olho real */
        .eye-container {
            position: relative;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9), 0 0 20px rgba(74, 222, 128, 0.2);
            transform: scale(1);
            transition: transform 0.05s linear;
            border: 3px solid rgba(74, 222, 128, 0.4);
        }

        .eye-img {
            width: 100%;
            height: 100%;
            object-type: cover;
            object-position: center;
            transform-origin: center;
        }

        /* Efeito de piscar */
        .blink-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #020617;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease;
            z-index: 4;
        }

        /* Coração brilhante que surge na pupila durante o zoom */
        .heart-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 2.5rem;
            color: #facc15;
            text-shadow: 0 0 20px #f59e0b, 0 0 40px #fbbf24;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 5;
        }

        /* Cartão final */
        .final-content {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            z-index: 10;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.2s ease, transform 1.2s ease;
            width: 85%;
            max-width: 380px;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #facc15;
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 0 50px rgba(250, 204, 21, 0.5);
            backdrop-filter: blur(8px);
        }

        .final-content.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }

        h1 {
            color: #facc15;
            font-size: 1.6rem;
            margin: 0 0 10px 0;
            text-shadow: 0 0 15px rgba(250, 204, 21, 0.8);
            letter-spacing: 2px;
        }

        p.quote {
            color: #e2e8f0;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .btn-surprise {
            background: linear-gradient(135deg, #facc15, #d97706);
            color: #030712;
            border: none;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            width: 100%;
            box-shadow: 0 4px 15px rgba(250, 204, 21, 0.4);
            transition: transform 0.2s;
        }
        .btn-surprise:active { transform: scale(0.96); }

        /* Modal Secreta */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.92);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 20;
        }
        .modal-box {
            background: #0f172a;
            border: 2px solid #facc15;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            max-width: 300px;
            box-shadow: 0 0 40px rgba(250, 204, 21, 0.4);
        }
        .modal-box p {
            color: #f8fafc;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .close-btn {
            background: #facc15;
            color: #030712;
            border: none;
            padding: 9px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>

    <div class="eye-container" id="eyeContainer">
        <!-- Foto macro real de um olho com tons esverdeados/amarelados de alta qualidade -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Green_eye_macro.jpg/800px-Green_eye_macro.jpg" alt="Realistic Eye" class="eye-img" id="eyeImg">
        <div class="heart-overlay" id="heartOverlay">💛</div>
        <div class="blink-overlay" id="blinkOverlay"></div>
    </div>

    <div class="final-content" id="finalContent">
        <h1>FOR KRIS 🌌</h1>
        <p class="quote">May the stars light up your path wherever you go. ✨</p>
        <button class="btn-surprise" onclick="openModal()">Click for a secret 💫</button>
    </div>

    <!-- Modal Secreta -->
    <div id="secretModal" class="modal">
        <div class="modal-box">
            <p>They say stars shine brighter when you're around the right person... 💫<br><br>*(Compiled specially for you!)*</p>
            <button class="close-btn" onclick="closeModal()">Close 💙</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('eyeContainer');
        const heart = document.getElementById('heartOverlay');
        const blink = document.getElementById('blinkOverlay');
        const finalContent = document.getElementById('finalContent');

        let startTime = Date.now();

        function loop() {
            let elapsed = (Date.now() - startTime) / 1000;

            // 1. Piscar natural nos primeiros segundos
            if (elapsed > 1.4 && elapsed < 1.7) {
                blink.style.opacity = '1';
            } else {
                blink.style.opacity = '0';
            }

            // 2. Zoom cinematográfico direto na pupila após 3 segundos
            if (elapsed > 3) {
                let zoomProgress = (elapsed - 3);
                let scale = 1 + zoomProgress * 2.2;
                container.style.transform = `scale(${scale})`;

                // Quando o zoom estiver bem próximo do centro, revela o coração brilhante
                if (zoomProgress > 1.2) {
                    heart.style.opacity = '1';
                    let heartScale = 1 + (zoomProgress - 1.2) * 3;
                    heart.style.transform = `translate(-50%, -50%) scale(${heartScale})`;
                }

                // Quando o zoom entra totalmente na pupila, revela o cartão final com o nome e a surpresa
                if (zoomProgress > 2.8) {
                    finalContent.classList.add('visible');
                }
            }

            if (elapsed < 8) {
                requestAnimationFrame(loop);
            }
        }

        setTimeout(loop, 400);

        function openModal() {
            const modal = document.getElementById('secretModal');
            if (modal) modal.style.display = 'flex';
        }

        function closeModal() {
            const modal = document.getElementById('secretModal');
            if (modal) modal.style.display = 'none';
        }
    </script>

</body>
</html>
