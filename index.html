<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Kris 🌌</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #0c1c38 0%, #030712 100%);
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        /* Fundo com efeito estelar elegante */
        .stars-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(#facc15 1px, transparent 1px);
            background-size: 35px 35px;
            opacity: 0.25;
            z-index: 1;
        }

        /* Cartão principal com cara de programadora/terminal */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #facc15;
            border-radius: 16px;
            padding: 30px 20px;
            max-width: 320px;
            width: 85%;
            box-shadow: 0 0 35px rgba(250, 204, 21, 0.35);
            backdrop-filter: blur(5px);
        }

        h1 {
            color: #facc15;
            font-size: 1.6rem;
            margin-top: 0;
            margin-bottom: 15px;
            text-shadow: 0 0 12px rgba(250, 204, 21, 0.6);
            letter-spacing: 2px;
        }

        p {
            color: #e2e8f0;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .btn {
            background: linear-gradient(135deg, #facc15, #d97706);
            color: #030712;
            border: none;
            padding: 12px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 4px 15px rgba(250, 204, 21, 0.4);
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.96); }

        /* Modal da Mensagem Secreta */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.9);
            z-index: 10;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background: #0f172a;
            border: 2px solid #facc15;
            padding: 25px;
            border-radius: 14px;
            text-align: center;
            max-width: 300px;
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.4);
        }

        .modal-content p {
            color: #f8fafc;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .close-btn {
            background: #facc15;
            color: #030712;
            border: none;
            padding: 9px 20px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>

    <div class="stars-bg"></div>

    <div class="card">
        <h1>FOR KRIS 🌌</h1>
        <p>May the stars light up your path wherever you go. ✨</p>
        <button class="btn" onclick="openModal()">Click for a secret 💫</button>
    </div>

    <!-- Modal -->
    <div id="secretModal" class="modal">
        <div class="modal-content">
            <p>They say stars shine brighter when you're around the right person... 💫<br><br>*(Compiled specially for you!)*</p>
            <button class="close-btn" onclick="closeModal()">Close 💙</button>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('secretModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('secretModal').style.display = 'none';
        }
    </script>

</body>
</html>
